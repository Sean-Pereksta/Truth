<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151715">
  <meta name="description" content="Race handmade karts across four four-race cups in Acorn Rally, including the Spectrum Cup's Prism Parade finale.">
  <title>Acorn Rally</title>
  <script type="module" data-catnmice-game="acornrally" data-confirmed="engine">
    if (location.protocol !== 'file:' && location.pathname.startsWith('/Truth/games/')) {
      import('../../hub/play-signal.mjs').catch(() => {});
    }
  </script>
  <link rel="icon" href="acorn.svg" type="image/svg+xml">
  <link rel="preload" as="font" type="font/ttf" href="fonts/rally-display.ttf" crossorigin>
  <link rel="preload" as="image" href="art/hero.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="rooms.css">
  <link rel="stylesheet" href="local-grid.css">
  <link rel="stylesheet" href="garage-view.css">
  <link rel="stylesheet" href="cup-menu.css">
</head>
<body>
  <a class="skip" href="#main">Skip to race hub</a>
  <div id="app">
    <header class="topbar"><div class="top-inner">
      <button class="brand" data-page="hub" aria-label="Acorn Rally race hub"><img src="acorn.svg" alt=""><span>ACORN <b>RALLY</b></span></button>
      <nav class="main-nav" aria-label="Main navigation">
        <button data-page="hub" class="active"><i data-i="flag"></i>Race hub</button>
        <button data-page="garage"><i data-i="garage"></i>Garage</button>
        <button data-page="records"><i data-i="trophy"></i>Records</button>
      </nav>
      <div class="header-tools">
        <button class="icon-btn header-sound" id="soundBtn" aria-label="Mute sound" title="Mute sound"></button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings"><i data-i="settings"></i></button>
        <span class="tool-divider"></span>
        <button class="profile" data-page="garage" title="Change driver"><img id="profileImage" src="art/driver-0.webp" alt=""><span id="profileName">Nib</span><i data-i="down"></i></button>
      </div>
    </div></header>
    <main id="main" class="main-wrap" tabindex="-1"></main>
    <footer class="footer"><span class="tiny-brand"><img src="acorn.svg" alt="">ACORN RALLY</span><div><button id="itemGuideBtn"><i data-i="bolt"></i>Acorn items</button><span></span><button id="guideBtn"><i data-i="gamepad"></i>Controls</button><span></span><a href="?download=pc"><i data-i="download"></i>PC edition</a></div></footer>
  </div>
  <div id="race" hidden></div>
  <dialog id="dialog"><div id="dialogContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="tracks-expansion.js"></script>
  <script src="kart-rig.js"></script>
  <script src="signature-kit.js"></script>
  <script src="signature-art.js"></script>
  <script src="minecart-hazards.js"></script>
  <script src="hazards.js"></script>
  <script src="ramps.js"></script>
  <script src="bullfrog-art.js"></script>
  <script src="cosmic-hazards-art.js"></script>
  <script src="course-art.js"></script>
  <script src="breakwater-tides.js"></script>
  <script src="race-sim.js"></script>
  <script src="surface-kit.js"></script>
  <script src="horizon.js"></script>
  <script src="item-art.js"></script>
  <script src="item-feedback.js"></script>
  <script src="ramp-art.js"></script>
  <script src="expansion-world.js"></script>
  <script src="drift-art.js"></script>
  <script src="race-world.js"></script>
  <script src="rally-course-scores.js?v=2"></script>
  <script src="rally-music.js?v=2"></script>
  <script src="gamepad-controls.js"></script>
  <script src="local-grid.js"></script>
  <script src="race.js"></script>
  <script src="network.js"></script>
  <script src="solstice-kart.js"></script>
  <script src="aurora-kart.js"></script>
  <script src="garage-view.js"></script>
  <script src="championship.js"></script>
  <script src="app.js"></script>
  <script src="pc-download.js"></script>
</body>
</html>
