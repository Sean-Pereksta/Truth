name: Bannerlands on Windows

on:
  push:
    branches: [main]
    paths:
      - 'games/bannerlands/app.js'
      - 'games/bannerlands/asset-loader.js'
      - 'games/bannerlands/source/build-host.mjs'
      - 'games/bannerlands/source/tests/standalone-browser.mjs'
      - 'games/bannerlands/source/desktop/launcher.mjs'
      - 'games/bannerlands/source/tests/launcher-pack.mjs'
      - '.github/workflows/bannerlands-windows.yml'
  pull_request:
    paths:
      - 'games/bannerlands/**'
      - '.github/workflows/bannerlands-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: games/bannerlands
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Check code and multiplayer services
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run check
          npm run test:multiplayer
      - name: Install browser test dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          npx playwright install chromium
      - name: Test the host form and Windows offline pack
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node source/build-standalone.mjs "$env:RUNNER_TEMP/bannerlands-pack"
          npm run test:multiplayer-lobby-browser
          npm run test:standalone-browser -- "$env:RUNNER_TEMP/bannerlands-pack/Bannerlands.html"
      - name: Verify the Catnmice local hosting pack
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pins = Get-Content -LiteralPath source/hosting/licenses/components.json -Raw | ConvertFrom-Json
          $tunnel = Join-Path $env:RUNNER_TEMP 'bannerlands-cloudflared.exe'
          $asset = "https://github.com/cloudflare/cloudflared/releases/download/$($pins.cloudflaredVersion)/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $asset -OutFile $tunnel
          $pack = Join-Path $env:RUNNER_TEMP 'bannerlands-hub-pack'
          node source/build-host.mjs --hub --output $pack --cloudflared $tunnel
          node source/tests/launcher-pack.mjs $pack
